<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Slilot</title>
  <script>
    // 黑匣子：页面任何 JS 错误回传本地服务器，便于远程诊断
    (function () {
      function report(msg) {
        try {
          fetch("/client-log", { method: "POST", headers: { "content-type": "text/plain" }, body: String(msg) });
        } catch (e) {}
      }
      window.addEventListener("error", function (e) {
        report("JS错误: " + e.message + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
      });
      window.addEventListener("unhandledrejection", function (e) {
        report("Promise拒绝: " + ((e.reason && e.reason.message) || e.reason));
      });
    })();
  </script>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"
          onerror="var s=document.createElement('script');s.async=false;s.src='office.js';document.head.appendChild(s);"></script>
  <script src="taskpane.js" defer></script>
  <link rel="stylesheet" href="taskpane.css"/>
</head>
<body>
  <div id="app">
    <div id="hdr">
      <div id="hdrTitle">
        <span class="dot"></span> Slilot
      </div>
      <div id="hdrBtns">
        <button id="newChatBtn" class="ghostBtn" title="清空对话" data-i18n="newChat">新会话</button>
        <button id="settingsBtn" class="ghostBtn" title="设置">⚙</button>
      </div>
    </div>

    <div id="chat"></div>

    <div id="statusbar" class="hidden"></div>

    <div id="modelBar"><span id="modelName" data-i18n="initializing">正在初始化…</span></div>

    <div id="inputBar">
      <textarea id="input" rows="2" placeholder="描述你想生成或修改的内容…（Enter 发送）" data-i18n-ph="inputPh"></textarea>
      <button id="sendBtn" data-i18n="send">发送</button>
    </div>

    <div id="settingsDlg" class="hidden">
      <div id="settingsCard">
        <div class="sTitle" data-i18n="settings">设置</div>
        <label class="sSection" data-i18n="sectionText">文本模型</label>
        <label data-i18n="upstreamBase">上游 Base（与下方格式拼接成完整地址）</label>
        <input id="setUpstream" type="text"/>
        <label data-i18n="protocol">接口格式</label>
        <select id="setFormat">
          <option value="messages">Anthropic — /v1/messages</option>
          <option value="responses">OpenAI — /v1/responses</option>
          </select>
        <label data-i18n="apiKey">API Key</label>
        <input id="setKey" type="password"/>
        <label data-i18n="textModel">文本模型</label>
        <input id="setModel" type="text"/>
        <label class="sSection" data-i18n="sectionImage">生图模型</label>
        <label data-i18n="imageBase">生图 Base（留空 = 用文本模型的上游）</label>
        <input id="setImageBase" type="text"/>
        <label data-i18n="imageKey">生图 API Key（留空 = 用文本模型的 Key）</label>
        <input id="setImageKey" type="password"/>
        <label data-i18n="imageModel">生图模型</label>
        <input id="setImageModel" type="text"/>
        <label>界面语言 / UI language</label>
        <select id="setUiLang">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <div class="sBtns">
          <button id="setTest" class="secondaryBtn" data-i18n="test">测试</button>
          <button id="setSave" class="primaryBtn" data-i18n="save">保存</button>
          <button id="setCancel" class="cancelBtn" data-i18n="cancel">取消</button>
        </div>
        <div id="setTestResult" class="testResult hidden"></div>
        <div id="saveHint" class="sHint"></div>
        <div class="sHint" data-i18n="hintKey">Key 只保存在本机浏览器存储中，随请求经本地代理转发。</div>
      </div>
    </div>
  </div>
</body>
</html>
